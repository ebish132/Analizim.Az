# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: ebish132/Analizim.Az
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/7b90f77c-05a3-4cf6-9929-d4658da15302/pkce
  auth_token_endpoint: /sites/7b90f77c-05a3-4cf6-9929-d4658da15302/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://lustrous-gumption-28875b.netlify.app

# Local testing only — DecapBridge PKCE is used automatically on the live site
local_backend: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "doctors"
    label: "Həkimlər"
    files:
      - file: "content/doctors.json"
        label: "Həkimlər siyahısı"
        name: "doctors"
        fields:
          - label: "Həkimlər"
            name: "doctors"
            widget: "list"
            summary: "{{name}} — {{specialty}}"
            fields:
              - { label: "Ad Soyad", name: "name", widget: "string" }
              - { label: "İxtisas", name: "specialty", widget: "string" }
              - { label: "Təcrübə", name: "experience", widget: "string" }
              - { label: "Şəkil", name: "photo", widget: "image", required: false }

  - name: "blog"
    label: "Bloq / Elanlar"
    files:
      - file: "content/blog.json"
        label: "Bloq yazıları"
        name: "posts"
        fields:
          - label: "Yazılar"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Başlıq", name: "title", widget: "string" }
              - { label: "Tarix", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Xülasə", name: "excerpt", widget: "text" }
              - { label: "Şəkil", name: "image", widget: "image", required: false }
